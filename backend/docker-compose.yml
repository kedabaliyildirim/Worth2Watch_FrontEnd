services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worth2watch
      POSTGRES_USER: worth2watch
      POSTGRES_PASSWORD: worth2watch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worth2watch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-please-change-me-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      DATABASE_URL: postgres://worth2watch:worth2watch@db:5432/worth2watch
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
